# /etc/wtr-guardia-discos.conf: lo relee wtr-guardia-discos en cada ciclo (30 s), sin reiniciar.
# El instalador lo copia sólo si no existe. Un valor inválido usa el de fábrica; ACCION inválida
# queda en apagar. Umbrales incoherentes (RETIRO < ESCALON <= APAGADO, CORROBORA < APAGADO)
# vuelven los cuatro a fábrica.

# apagar (producción) o simulacro (registra el apagado, el marcador y la métrica, sin ejecutarlo).
# Con simulacro la alerta WtrGuardiaDiscosCaida avisa: la guardia no protege.
ACCION=apagar

# Todo el aire (255 en SYS y SATA) desde ESCALON_C en una lectura; se retira bajo RETIRO_C.
ESCALON_C=54
RETIRO_C=50

# Apagado corroborado: un disco >= APAGADO_C en 3 lecturas seguidas
# y otro >= CORROBORA_C en 2 de esas 3. Un disco aislado da todo el aire y alerta crítica, sin apagar.
APAGADO_C=58
CORROBORA_C=50

# Tras un apagado de la guardia, durante CAUTELA_MIN minutos desde el arranque no apaga salvo con
# tres discos corroborando.
CAUTELA_MIN=30

CICLO_S=30
# Sin ninguna lectura durante CICLOS_CIEGA ciclos: todo el aire (ciega), sin apagar.
CICLOS_CIEGA=10

# Vacío = descubrimiento automático. Para pruebas: rutas /dev/...
DISCOS=
