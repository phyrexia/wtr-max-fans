# /etc/wtr-ventiladores.conf: lo relee wtr-ventiladores en cada ciclo (60 s), sin reiniciar.
# El instalador nunca pisa un archivo editado en el host: sólo reemplaza una versión distribuida antes
# y sin editar (deja una copia .anterior-<fecha>); si fue editado, lo conserva, muestra el diff y las
# claves nuevas que faltan. Una clave ausente toma el valor de fábrica.
# Un valor inválido usa el de fábrica (métrica wtr_ventiladores_config_ok=0, alerta
# WtrConfiguracionInvalida a los 10 min). Si la curva no es coherente, la curva entera vuelve a
# fábrica. Se exige, en cada canal:
#   T_PISO_C < T_SILENCIO_C < T_CONVERGE_C <= T_MAX_C
#   51 <= PISO_NOCHE < PISO <= SILENCIO
#   PISO_NOCHE <= NOCHE < SILENCIO
#   RESPALDO >= PISO
#   CICLOS_CONVERGENCIA >= CICLOS_BAJADA (si no, sólo esos dos vuelven a fábrica)
# La noche va siempre por debajo del día: «noche = día» es un error de configuración. Para no tener
# curva nocturna, MODO=dia.

# auto = calendario fijo en hora de Madrid (noche 21:00-09:00, 10:00 fines de semana y festivos de
# festivos-madrid.txt); dia o noche lo fuerzan.
MODO=auto
CICLO_S=60

# Temperatura máxima de los HDD (°C): hasta T_PISO, el piso (de noche, PISO_NOCHE); rampa hasta
# T_SILENCIO (SILENCIO de día, NOCHE de noche); de noche, rampa hasta coincidir con la curva diurna
# en T_CONVERGE; desde T_MAX, 255.
T_PISO_C=38
T_SILENCIO_C=46
T_CONVERGE_C=50
T_MAX_C=52

# Suavizado: sube como mucho PASO_SUBIDA por ciclo (salvo objetivo 255). Con el objetivo por debajo
# baja PASO_BAJADA por ciclo tras CICLOS_BAJADA ciclos si el hueco es de BANDA_MUERTA o más, o tras
# CICLOS_CONVERGENCIA ciclos seguidos con cualquier hueco (1-60). Una bajada sigue hasta el objetivo.
PASO_SUBIDA=20
PASO_BAJADA=4
BANDA_MUERTA=6
CICLOS_BAJADA=3
CICLOS_CONVERGENCIA=10

# SATA (pwm5): enfría la jaula de los seis HDD.
# Día: piso 115 (45 %) y 153 (60 %, el punto cómodo del mantenedor) en T_SILENCIO.
# Noche: piso 89 (35 %, 708 rpm medidos el 2026-10-14) y 128 (50 %, ~1010 rpm) en T_SILENCIO.
# RESPALDO: lo que deja ExecStopPost; diurno a propósito (fallo = más aire).
PISO_SATA=115
SILENCIO_SATA=153
PISO_NOCHE_SATA=89
NOCHE_SATA=128
RESPALDO_SATA=153

# SYS (pwm3): el ventilador de la base.
# Día: piso 77 (30 %, ~730 rpm) y 100 (39 %) en T_SILENCIO.
# Noche: piso 64 (25 %, 511 rpm medidos el 2026-10-14) y 77 en T_SILENCIO. 51 (20 %) sólo tras un
# remojo de 1 h sin ninguna lectura 0 del tacómetro (README del repositorio wtr-max-fans).
PISO_SYS=77
SILENCIO_SYS=100
PISO_NOCHE_SYS=64
NOCHE_SYS=77
RESPALDO_SYS=77

# Vacío = descubrimiento automático de los HDD ATA rotacionales. Para pruebas: rutas /dev/...
DISCOS=
